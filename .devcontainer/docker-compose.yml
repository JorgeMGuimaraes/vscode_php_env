version: "3"

services:
    php:
        build:
            context: .
            args:
                - PHP_VARIANT=7.4.8
                - ALPINE_VARIANT=3.12
        volumes:
            - ../src:/workspace:cached
        ports:
            # For use with PHP (e.g. `php -S localhost:8080`)
            - "8080:8080"
        command: sleep infinity
    mariadb:
        image: yobasystems/alpine-mariadb:10.4.13
        expose:
            # Expose mariadb port to php service (Access as hostname "mariadb" from within php container)
            - "3306"
        # Uncomment to allow access to mariadb from external tools
        ports:
             - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: hguyFtgfR4r9R4r76
            MYSQL_USER: jorge
            MYSQL_PASSWORD: hguyFt6S95dgfR4ryb
            # Not used
            # MYSQL_DATABASE: specify the name of the database
            # MYSQL_CHARSET: default charset (utf8) for Mariadb
            # MYSQL_COLLATION: default collation (utf8_general_ci) for Mariadb
        volumes:
            - ../mysql/mysql:/var/lib/mysql
            - ../mysql/mysql-bin:/var/lib/mysql/mysql-bin
        restart: always
